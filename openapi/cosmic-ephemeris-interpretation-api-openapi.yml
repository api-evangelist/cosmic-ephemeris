components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        required:
          anyOf:
          - type: array
            items:
              type: string
          - type: object
            additionalProperties:
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
        example:
          type: object
          additionalProperties: true
      required:
      - error
      additionalProperties: true
      description: Current gateway errors guarantee an error string, not a universal code/details envelope. Some validation errors add required/example. Reverse-proxy failures can be HTML, so clients must not assume JSON for every non-2xx.
    HistoricalTimezone:
      type: string
      pattern: ^UT1(?:[+-](?:0[0-9]|1[0-3]):[0-5][0-9](?::[0-5][0-9])?|[+-]14:00(?::00)?)?(?![\s\S])
      description: Explicit UT1 or fixed offset UT1+/-HH:MM[:SS], within 14 hours. Local clock minus offset yields UT1, not UTC. No IANA timezone inference. Original offset spelling is preserved.
    PlanetName:
      type: string
      enum:
      - Sun
      - Moon
      - Mercury
      - Venus
      - Mars
      - Jupiter
      - Saturn
      - Uranus
      - Neptune
      - Pluto
    ConnectedHoroscopeHoroscopeResponse:
      oneOf:
      - $ref: '#/components/schemas/HoroscopeResponse'
      - $ref: '#/components/schemas/HistoricalHoroscopeHoroscopeResponse'
    HistoricalBirthInput:
      type: object
      additionalProperties: false
      required:
      - date
      - time
      - timezone
      - lat
      - lon
      properties:
        date:
          $ref: '#/components/schemas/HistoricalDate'
        time:
          $ref: '#/components/schemas/HistoricalClock'
        timezone:
          $ref: '#/components/schemas/HistoricalTimezone'
        lat:
          type: number
          exclusiveMinimum: -90
          exclusiveMaximum: 90
        lon:
          type: number
          minimum: -180
          exclusiveMaximum: 180
    OptionalTransitTime:
      anyOf:
      - $ref: '#/components/schemas/Time'
      - type: 'null'
      default: '12:00'
      description: Omitted/null means 12:00; false/empty string and malformed values are rejected.
    InterpretationAtom:
      type: object
      properties:
        planet:
          $ref: '#/components/schemas/PlanetName'
        planet_nature:
          type: string
          enum:
          - luminary
          - neutral
          - benefic
          - malefic
        planet_sect:
          type: string
          enum:
          - day
          - night
          - neutral
        chart_sect:
          type: string
          enum:
          - day
          - night
          description: Natal apparent topocentric Sun center geometric altitude >0 degrees means day; WGS84 elevation zero, no atmospheric refraction.
        aspect:
          type: string
          enum:
          - Conjunction
          - Opposition
          - Square
          - Trine
          - Sextile
        natal_point:
          $ref: '#/components/schemas/PlanetName'
        house:
          type: 'null'
          description: No house assignment is implemented for this endpoint.
        house_topics:
          type: array
          items:
            type: string
          maxItems: 0
        tone:
          type: string
          enum:
          - intensifying
          - polarizing
          - challenging
          - supportive
          - opportunity
        intensity:
          type: number
          minimum: 0.1
          maximum: 1
          description: Deterministic traditional-rule heuristic, not a probability or scientifically validated prediction.
        tradition:
          type: array
          items:
            type: string
            enum:
            - hellenistic
            - western
          minItems: 2
          maxItems: 2
        summary_key:
          type: string
          description: Machine key such as saturn_square_sun, not authored/generated prose.
      required:
      - planet
      - planet_nature
      - planet_sect
      - chart_sect
      - aspect
      - natal_point
      - house
      - house_topics
      - tone
      - intensity
      - tradition
      - summary_key
      additionalProperties: true
    ZodiacInput:
      type:
      - string
      - 'null'
      pattern: ^\s*(?:[Tt][Rr][Oo][Pp][Ii][Cc][Aa][Ll]|[Ss][Ii][Dd][Ee][Rr][Ee][Aa][Ll])\s*$
      default: tropical
      description: tropical or sidereal; server trims whitespace and ignores case. Omitted/null selects tropical.
      x-canonical-values:
      - tropical
      - sidereal
    HistoricalDate:
      type: object
      additionalProperties: false
      required:
      - year
      - era
      - month
      - day
      - calendar
      properties:
        year:
          type: integer
          minimum: 1
          maximum: 2500
        era:
          enum:
          - BCE
          - CE
          description: Display BCE (BC) / CE (AD); API values remain BCE / CE. No year zero.
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        calendar:
          enum:
          - proleptic_gregorian
          - proleptic_julian
          description: Explicit choice; applies the selected calendar rules throughout history without a regional adoption switch.
      allOf:
      - if:
          type: object
          properties:
            era:
              const: BCE
        then:
          type: object
          properties:
            year:
              maximum: 1000
      description: Explicit civil date, 1000 BCE (BC)–2500 CE (AD); no year zero. Calendar validity is checked by the server. Available only on documented connected historical operations, with explicit UT1/fixed-offset conventions.
    HistoricalDateTime:
      type: object
      additionalProperties: false
      required:
      - date
      - time
      - timezone
      properties:
        date:
          $ref: '#/components/schemas/HistoricalDate'
        time:
          $ref: '#/components/schemas/HistoricalClock'
        timezone:
          $ref: '#/components/schemas/HistoricalTimezone'
      description: Shared historical input contract; parsing alone does not enable a calculation route. Derived calculation records can include fractional seconds and are not this input type.
    Date:
      type: string
      format: date
      pattern: ^(?:18[0-9]{2}|19[0-9]{2}|2[01][0-9]{2}|2200)-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$
      description: Valid Gregorian YYYY-MM-DD local civil date, inclusive 1800-01-01 through 2200-12-31. Calendar validity and timezone conversion are checked by the server.
    HoroscopeRequest:
      type: object
      properties:
        birth:
          $ref: '#/components/schemas/BirthInput'
        transitDate:
          anyOf:
          - $ref: '#/components/schemas/Date'
          - type: 'null'
          description: Omitted/null selects the engine host current UTC date. Supply an explicit date for reproducible results.
        transitTime:
          $ref: '#/components/schemas/OptionalTransitTime'
        timezone:
          $ref: '#/components/schemas/Timezone'
          description: Transit timezone only. Omitted/null/empty string means UTC, NOT the birth timezone. Birth timezone is not overridden.
        zodiac:
          $ref: '#/components/schemas/ZodiacInput'
        ayanamsa:
          $ref: '#/components/schemas/AyanamsaInput'
      required:
      - birth
      additionalProperties: true
      allOf:
      - $ref: '#/components/schemas/SiderealFlagsConstraint'
    AyanamsaInput:
      type:
      - string
      - 'null'
      pattern: \S
      default: lahiri
      description: Sidereal supports lahiri, raman, krishnamurti, fagan_bradley, yukteshwar, sassanian, true_chitra, true_revati, true_pushya, galactic_center_0_sagittarius, galactic_alignment_mardyks, with case/whitespace normalization; other names return 400 in sidereal mode. Omitted/null selects lahiri. Tropical mode ignores a nonempty string and outputs null. This schema describes that compatibility behavior rather than claiming every string is a supported sidereal model.
      x-canonical-values:
      - lahiri
      - raman
      - krishnamurti
      - fagan_bradley
      - yukteshwar
      - sassanian
      - true_chitra
      - true_revati
      - true_pushya
      - galactic_center_0_sagittarius
      - galactic_alignment_mardyks
    Latitude:
      anyOf:
      - type: number
        exclusiveMinimum: -90
        exclusiveMaximum: 90
      - type: string
        pattern: ^\s*[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?\s*$
      description: WGS84 decimal latitude. JSON numbers are recommended; numeric strings are accepted by the current engine, then checked for finiteness/range. Exact poles and undefined Ascendant geometry return 400; supported successful latitude is strictly between -90 and 90. Boolean/null/object/array coordinates are invalid.
    Time:
      type: string
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$
      description: HH:MM or HH:MM:SS; no offset in this field. Use timezone to select the civil-time zone.
    Interpretation:
      type: object
      properties:
        summary:
          type: object
          properties:
            overall_tone:
              type: string
              enum:
              - supportive
              - challenging
              - mixed
            intensity:
              type: number
              minimum: 0
              maximum: 1
          required:
          - overall_tone
          - intensity
          additionalProperties: true
        transits:
          type: array
          items:
            $ref: '#/components/schemas/InterpretationAtom'
      required:
      - summary
      - transits
      additionalProperties: true
    HistoricalClock:
      type: string
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?(?![\s\S])
      description: Explicit HH:MM[:SS]; whole seconds only, no leap seconds. Normalized helper output includes seconds.
    HoroscopeResponse:
      type: object
      properties:
        type:
          const: horoscope
        input:
          type: object
          properties:
            birth:
              $ref: '#/components/schemas/BirthInput'
            transitDate:
              $ref: '#/components/schemas/Date'
            zodiac:
              $ref: '#/components/schemas/ZodiacInput'
            ayanamsa:
              $ref: '#/components/schemas/AyanamsaInput'
          required:
          - birth
          - transitDate
          - zodiac
          - ayanamsa
          additionalProperties: true
        interpretation:
          $ref: '#/components/schemas/Interpretation'
      required:
      - type
      - input
      - interpretation
      additionalProperties: true
      description: Supported deterministic structured major-aspect signals. No language model, prose, compatibility score, medical/financial prediction, or house topics. The input echo currently omits transitTime/timezone; retain your request for reproducibility.
    HistoricalHoroscopeRequest:
      type: object
      properties:
        birth:
          $ref: '#/components/schemas/HistoricalBirthInput'
        zodiac:
          type:
          - string
          - 'null'
          pattern: ^\s*(?:[Tt][Rr][Oo][Pp][Ii][Cc][Aa][Ll]|[Ss][Ii][Dd][Ee][Rr][Ee][Aa][Ll])\s*$
          default: tropical
          description: tropical or sidereal; server trims whitespace and ignores case. Omitted/null selects tropical.
          x-canonical-values:
          - tropical
          - sidereal
        ayanamsa:
          type:
          - string
          - 'null'
          pattern: \S
          default: lahiri
          description: Sidereal supports lahiri, raman, krishnamurti, fagan_bradley, yukteshwar, sassanian, true_chitra, true_revati, true_pushya, galactic_center_0_sagittarius, galactic_alignment_mardyks, with case/whitespace normalization; other names return 400 in sidereal mode. Omitted/null selects lahiri. Tropical mode ignores a nonempty string and outputs null. This schema describes that compatibility behavior rather than claiming every string is a supported sidereal model.
          x-canonical-values:
          - lahiri
          - raman
          - krishnamurti
          - fagan_bradley
          - yukteshwar
          - sassanian
          - true_chitra
          - true_revati
          - true_pushya
          - galactic_center_0_sagittarius
          - galactic_alignment_mardyks
        at:
          $ref: '#/components/schemas/HistoricalDateTime'
      required:
      - birth
      - at
      additionalProperties: false
      allOf:
      - description: Only supported ayanamsa names are valid when zodiac is sidereal; tropical retains its legacy ignore behavior.
        if:
          type: object
          properties:
            zodiac:
              type: string
              pattern: ^\s*(?:[Ss][Ii][Dd][Ee][Rr][Ee][Aa][Ll])\s*$
          required:
          - zodiac
        then:
          type: object
          properties:
            ayanamsa:
              type:
              - string
              - 'null'
              pattern: ^\s*(?:[Ll][Aa][Hh][Ii][Rr][Ii]|[Rr][Aa][Mm][Aa][Nn]|[Kk][Rr][Ii][Ss][Hh][Nn][Aa][Mm][Uu][Rr][Tt][Ii])\s*$
      description: Explicit historical mode, 1000 BCE (BC)–2500 CE (AD). No year zero, implicit calendar, UTC or IANA zone. Preserve tool-specific mathematical, geographic and search limits; calendar/time conventions and estimated Delta-T are not certified historical accuracy.
    SiderealFlagsConstraint:
      description: Only supported ayanamsa names are valid when zodiac is sidereal; tropical retains its legacy ignore behavior.
      if:
        type: object
        properties:
          zodiac:
            type: string
            pattern: ^\s*(?:[Ss][Ii][Dd][Ee][Rr][Ee][Aa][Ll])\s*$
        required:
        - zodiac
      then:
        type: object
        properties:
          ayanamsa:
            type:
            - string
            - 'null'
            pattern: ^\s*(?:[Ll][Aa][Hh][Ii][Rr][Ii]|[Rr][Aa][Mm][Aa][Nn]|[Kk][Rr][Ii][Ss][Hh][Nn][Aa][Mm][Uu][Rr][Tt][Ii])\s*$
    HistoricalHoroscopeHoroscopeResponse:
      type: object
      additionalProperties: true
      required:
      - schema
      - status
      - type
      - input
      - result
      - metadata
      properties:
        schema:
          const: cosmicephemeris-historical-calculation-v1
        status:
          const: historical
        type:
          const: horoscope
        input:
          $ref: '#/components/schemas/HistoricalHoroscopeRequest'
        result:
          type: object
          additionalProperties: true
          description: Complete historical calculation adapter result. Times are explicit UT1 date records, never UTC strings; derived times may include fractional seconds and years outside the input range.
        metadata:
          type: object
          additionalProperties: true
          required:
          - time_standard
          - historical_accuracy_certified
          - warnings
          properties:
            time_standard:
              const: UT1
            historical_accuracy_certified:
              const: false
            warnings:
              type: array
              items:
                type: string
    ConnectedHoroscopeRequest:
      oneOf:
      - $ref: '#/components/schemas/HoroscopeRequest'
      - $ref: '#/components/schemas/HistoricalHoroscopeRequest'
    Longitude:
      anyOf:
      - type: number
        minimum: -180
        maximum: 180
      - type: string
        pattern: ^\s*[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?\s*$
      description: WGS84 decimal longitude, east positive, within [-180,180]. JSON numbers are recommended; numeric strings are accepted then checked for finiteness/range.
    Timezone:
      type:
      - string
      - 'null'
      description: IANA timezone name (for example America/New_York). Omission, null, or empty string means UTC for a birth input. Nonexistent or ambiguous local clock-change times return 400; provide the known UTC date/time with timezone UTC instead.
      examples:
      - UTC
      - America/New_York
      - Asia/Kolkata
    BirthInput:
      type: object
      properties:
        date:
          $ref: '#/components/schemas/Date'
        time:
          $ref: '#/components/schemas/Time'
        timezone:
          $ref: '#/components/schemas/Timezone'
        lat:
          $ref: '#/components/schemas/Latitude'
        lon:
          $ref: '#/components/schemas/Longitude'
      required:
      - date
      - time
      - lat
      - lon
      additionalProperties: true
  responses:
    NotFound:
      description: Wrong/case-variant/noncanonical or trailing-slash route; public paths have no version prefix.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Not found
        text/html:
          schema:
            type: string
            description: A reverse proxy may return an HTML error page.
    Busy:
      description: 'Four-request global calculation pool full (Retry-After: 2), maintenance or upstream service unavailable.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Astrology service is busy; retry shortly
        text/html:
          schema:
            type: string
            description: A reverse proxy may return an HTML error page.
      headers:
        Retry-After:
          description: Present for application concurrency rejection as 2 seconds. Other rejection sources may omit it or use a different delay. Do not automatically retry charged calculation attempts.
          schema:
            type: string
    Unauthorized:
      description: Missing, invalid, revoked API key or unavailable activated key owner. Dashboard cookies do not authenticate calculation routes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Missing API key
    TooLarge:
      description: Request exceeds the body limit; gateway JSON is capped at 128 KiB. Edge failures may be HTML.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Request body too large
        text/html:
          schema:
            type: string
            description: A reverse proxy may return an HTML error page.
    InvalidInput:
      description: Invalid request, malformed JSON, out-of-range date/location, unknown model, invalid timezone or ambiguous/nonexistent clock-change time. Invalid attempts reaching quota reservation consume one unit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Invalid request
        text/html:
          schema:
            type: string
            description: A reverse proxy may return an HTML error page.
    Forbidden:
      description: Origin not allowed by production CORS policy. Server-to-server requests can omit Origin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Origin not allowed
    EngineUnavailable:
      description: Engine unavailable, unsuccessful internal server response or invalid upstream JSON. No engine internals are exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Birth chart calculation failed
        text/html:
          schema:
            type: string
            description: A reverse proxy may return an HTML error page.
    EngineTimeout:
      description: 'Application engine timeout: 15 seconds normally; planetary events, house ingresses, aspect windows, event calendar, eclipse geometry, electional search, and event-rule search use 30 seconds; Nakshatra Timeline plus the explicitly enumerated readiness, robustness, location, uncertainty, and electional-audit family use 60 seconds. Timer includes response-body parsing; an admitted timeout consumes quota.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Birth chart calculation failed
        text/html:
          schema:
            type: string
            description: A reverse proxy may return an HTML error page.
    Limited:
      description: 'Monthly quota exhausted, per-user two-request concurrency reached, or nginx rate/connection admission refused. Retry-After: 2 is sent for application per-user concurrency only, not a promise that monthly quota resets in two seconds.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: API quota exceeded
        text/html:
          schema:
            type: string
            description: A reverse proxy may return an HTML error page.
      headers:
        Retry-After:
          description: Present for application concurrency rejection as 2 seconds. Other rejection sources may omit it or use a different delay. Do not automatically retry charged calculation attempts.
          schema:
            type: string
    InternalFailure:
      description: Bounded gateway/database/internal failure. An admitted attempt can still consume quota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            typical:
              value:
                error: Server error
        text/html:
          schema:
            type: string
            description: A reverse proxy may return an HTML error page.
  securitySchemes:
    BearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: 64 hexadecimal characters
      description: Opaque 256-bit Cosmic Ephemeris key; not a Stripe key or dashboard JWT. Exact 'Bearer ' prefix.
    HeaderApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Opaque 64-hex-character Cosmic Ephemeris key. Use instead of Authorization; a nonempty Bearer credential takes precedence if both are sent.
x-plan-limits:
  period: UTC calendar month
  standard:
    free: 500
    basic: 10000
    pro: 100000
  nakshatra:
    pro: 1000
x-verification-boundary: Seventy-eight deployed calculation contracts are described. The twenty-six R206-R231 electional reliability audits are bounded sampled evidence without hidden weights, rankings, interpretation, prediction, or recommendation. Ashtakavarga is an unreduced calculation-only current contract; specialist review does not alter its technical support status. House ingresses use fixed Equal/Whole Sign reference cusps and exclude Placidus/Porphyry. Natal pattern and planetary-hour classifications are bounded calculation-only methods. Fixed-star activation requires the immutable admitted six-row CC0 catalog; no minor-body contract or runtime is included.
